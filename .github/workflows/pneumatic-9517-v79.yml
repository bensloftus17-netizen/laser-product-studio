name: Pneumatic scraper source-checked competitor tests

on:
  push:
    branches: [main]
    paths:
      - "competitor_catalogue.py"
      - "competitor_finder.py"
      - "test_pneumatic_9517_v79.py"
      - ".github/workflows/pneumatic-9517-v79.yml"
  workflow_dispatch:

jobs:
  genuine-scraper-alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check category and source comparison tests
        run: |
          python -m py_compile competitor_finder.py competitor_catalogue.py
          python -m unittest -v test_pneumatic_9517_v79.py test_competitor_4832_v74.py test_competitor_finder_v49.py
