name: Laser campaign poster regression

on:
  push:
    branches: [main]
    paths:
      - "campaign_hub.py"
      - "creative_families.py"
      - "reference_poster_templates.py"
      - "workshop_promo_template.py"
      - "creative_qa.py"
      - "format_creative.py"
      - "test_role_separation_v69.py"
      - "test_reference_templates_v67.py"
      - "test_reference_critic_v68.py"
      - "test_review_outage_v70.py"
      - "app.py"
      - ".github/workflows/poster-regression.yml"
  workflow_dispatch:

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and poster modules
        run: python -m py_compile app.py campaign_hub.py creative_families.py format_creative.py reference_poster_templates.py workshop_promo_template.py
      - name: Verify reference layouts and diversity rules
        run: python -m unittest -v test_role_separation_v69.py test_reference_templates_v67.py test_reference_critic_v68.py test_review_outage_v70.py
