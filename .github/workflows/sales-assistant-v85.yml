name: V85 Sales Assistant Regression
on:
  push:
    branches: [main]
    paths:
      - 'sales_assistant.py'
      - 'static/sales_assistant.js'
      - 'test_sales_assistant_v85.py'
      - 'app.py'
      - '.github/workflows/sales-assistant-v85.yml'
  workflow_dispatch:
jobs:
  text-only-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py sales_assistant.py test_sales_assistant_v85.py
      - run: node --check static/sales_assistant.js
      - run: python -m unittest -v test_sales_assistant_v85.py
        env:
          GEMINI_API_KEY: ""
