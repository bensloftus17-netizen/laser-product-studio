name: V80 Smart Artwork and Editor Regression

on:
  push:
    branches: [main]
    paths:
      - "campaign_design_v80.py"
      - "creative_director.py"
      - "flexible_canvas.py"
      - "campaign_director.py"
      - "campaign_hub.py"
      - "campaign_art_quality.py"
      - "poster_live_edit.py"
      - "disk_campaign_store.py"
      - "app.py"
      - "static/campaign_poster_edit.js"
      - "static/styles.css"
      - "test_smart_artwork_editor_v80.py"
      - "test_creative_editor_v44.py"
      - ".github/workflows/studio-v80.yml"
  workflow_dispatch:

jobs:
  memory-safe-creative-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app requirements
        run: python -m pip install -r requirements.txt
      - name: Compile altered modules
        run: python -m py_compile app.py creative_director.py flexible_canvas.py campaign_design_v80.py campaign_director.py campaign_hub.py campaign_art_quality.py poster_live_edit.py disk_campaign_store.py
      - name: Validate client scripts
        run: |
          node --check static/campaign_poster_edit.js
          python -c "from app import V7_HOME_PAGE; open('/tmp/laser-ui-v80.js','w',encoding='utf-8').write(V7_HOME_PAGE.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/laser-ui-v80.js
      - name: Run product-specific layout, single-poster edits, gallery and RAM regressions
        env:
          GEMINI_API_KEY: ""
        run: python -m unittest -v test_smart_artwork_editor_v80.py test_multi_gallery_v77.py test_render_memory_v73.py test_creative_editor_v44.py
