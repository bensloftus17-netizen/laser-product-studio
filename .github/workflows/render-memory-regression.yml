name: Render 512MiB memory safety regression

on:
  push:
    branches: [main]
    paths:
      - "memory_guard.py"
      - "disk_campaign_store.py"
      - "app.py"
      - "campaign_hub.py"
      - "ai_photo_effects.py"
      - "asset_quality.py"
      - "competitor_finder.py"
      - "source_image_selection.py"
      - "test_render_memory_v73.py"
      - ".github/workflows/render-memory-regression.yml"
  workflow_dispatch:

jobs:
  memory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and photo dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all modified modules
        run: python -m py_compile app.py memory_guard.py competitor_finder.py ai_photo_effects.py asset_quality.py disk_campaign_store.py campaign_hub.py
      - name: Test real preview storage, concurrency, PDF images and source safety
        env:
          DISABLE_STOCK_PHOTOS: "1"
        run: python -m unittest -v test_render_memory_v73.py test_campaign_memory_v65.py test_competitor_finder_v49.py test_why_choose_laser_v72.py
      - name: Validate dashboard scripts
        run: |
          python -c "from app import V7_HOME_PAGE; open('/tmp/laser-ui.js','w',encoding='utf-8').write(V7_HOME_PAGE.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/laser-ui.js
