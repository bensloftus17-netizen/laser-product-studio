name: Laser Product Studio smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test posters, UK VAT and English filters
        env:
          DISABLE_STOCK_PHOTOS: "1"
        run: python -m unittest -v test_studio.py test_ai_design.py test_ai_creative.py test_ai_promos.py test_ai_editor.py test_ai_v3.py test_scene_library.py test_ai_polish.py test_ai_white_gaps.py test_ai_campaign_layouts.py test_real_8899_photo.py test_scene_variants.py test_render_wake.py test_standard_cutouts.py test_poster_quality.py test_ai_art_direction.py test_promo_upgrades.py test_promo_copy.py test_campaign_hub.py test_marketing_hub_dashboard.py test_copy_rewriter.py test_gemini_recovery.py test_optional_downloads.py

      - name: Validate campaign dashboard JavaScript syntax
        run: |
          python -c "from app import V7_HOME_PAGE; open('/tmp/laser-studio-ui.js','w',encoding='utf-8').write(V7_HOME_PAGE.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/laser-studio-ui.js

      - name: Keep real 8899 cutout proof for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-8899-photo-verification
          path: test_artifacts/
          if-no-files-found: ignore
          retention-days: 2
