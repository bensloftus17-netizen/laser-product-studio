services:
  - type: web
    name: laser-product-studio
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 95
    healthCheckPath: /api/health
    autoDeployTrigger: commit
